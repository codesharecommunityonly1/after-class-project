<!DOCTYPE html>
<html lang="en">
<head>
    <title>Media Page</title>
    <link href="style.css" rel="stylesheet" type="text/css" />
</head>
<body>
    <h2>Welcome to Codingal</h2>
    <center>
        <img src="image.png" alt="Codingal" width="1000" height="500">
    </center>
    <hr>
    <h2>This is one of my favourite song</h2>
    <audio controls autoplay muted>
        <source src="audio.mp3" type="audio/mpeg">
        Your browser does not support the audio tag.
    </audio>
    <p>This is one of my favourite video</p>
    <video width="400" height="300" controls autoplay muted poster="image.png" loop>
        <source src="video.mp4" type="video/mp4">
        Your browser does not support the video tag.
    </video>
    <hr>
    <!-- Section 4: Iframe (YouTube Video) -->
    <center>
        <h1>Using Iframe you can show any online video in your project</h1>
        <iframe width="500" height="400" 
            src="https://www.youtube.com/embed/lsCObbRG370?autoplay=1&mute=1">
        </iframe>
    </center>
</body>
</html>
